  for(const l in DATA)for(const y in DATA[l])DATA[l][y].forEach((c,i)=>{if(ok(norm(c.n+" "+(c.a||"")+" "+c.code)))cs.push([l,y,i,c])});
  const bs=idx().filter(e=>ok(e.h));
  return["الفقه",cr([[t.home,"#/level"],[t.sres]])+'<h2 dir="auto">'+esc(q)+'</h2><p class="mu">'+num(cs.length)+" "+t.crs+" · "+num(bs.length)+" "+t.bks+"</p>"+(cs.length?"<h3>"+t.crs+'</h3><div class="grid">'+cs.slice(0,30).map(x=>cc(...x)).join("")+"</div>":"")+(bs.length?"<h3>"+t.bks+"</h3>"+bs.slice(0,100).map(e=>bookRow(e.b,e.c,e)).join("")+(bs.length>100?'<p class="mu">…</p>':""):"")+(!cs.length&&!bs.length?'<p class="note">'+t.none+"</p>":"")]}
function myview(){const t=T(),I=idx(),row=k=>{const e=I.find(x=>x.k===k);return e?bookRow(e.b,e.c,e):""};const a=favs().map(row).join(""),b=recs().map(row).join("");
  return["الفقه",cr([[t.home,"#/level"],[t.mine]])+"<h2>★ "+t.favT+"</h2>"+(a||'<p class="note">'+t.noFav+"</p>")+"<h2>"+t.recT+"</h2>"+(b||'<p class="note">'+t.noRec+"</p>")]}
function nview(){const t=T(),L=S.lang;
  return["اقرأ",cr([[t.home,"#/level"],[t.noticeT]])+"<h2>🔔 "+t.noticeT+"</h2>"+(NOTICES.length?NOTICES.slice().sort((a,b)=>b.id-a.id).map(n=>{const x=n[L]||n.bn;return'<div class="nt"><b dir="auto">'+esc(x.t)+'</b> <span class="mu">'+esc(n.date)+'</span><p dir="auto">'+esc(x.b)+"</p></div>"}).join(""):"")+(NOTICES.length?notifBtn():"")]}
function notifBtn(){const t=T();if(typeof Notification==="undefined")return"";return Notification.permission==="granted"&&ls("notif")==="1"?'<p class="mu">✓ '+t.notifOn+"</p>":'<button class="btn alt" data-notif="1">'+t.notif+'</button><p class="mu">'+t.notifNote+"</p>"}
function foot(){const t=T(),c=SITE.endpoint||SITE.key;
  $("#ft").innerHTML='<div class="fb"><button class="pl" data-share="1">'+t.share+'</button><button class="pl" data-qr="1">'+t.qr+"</button>"+(c||SITE.form?'<button class="pl" data-cform="1">'+t.contactT+"</button>":"")+'</div><div id="qrb" hidden><img id="qri" alt="QR" width="180" height="180"></div>'+(c?'<div id="cfb" hidden><form id="cf"><select name="topic">'+t.cOpts.map(o=>"<option>"+o+"</option>").join("")+'</select><input name="book" placeholder="'+esc(t.cBook)+'"><textarea name="message" rows="4" placeholder="'+esc(t.cMsg)+'" required></textarea><input name="contact" placeholder="'+esc(t.cName)+'"><input name="_gotcha" tabindex="-1" autocomplete="off" style="display:none"><button class="btn">'+t.cSend+'</button><p id="cmsg" class="mu" role="status"></p></form></div>':"")+'<p class="mu">'+t.disc+"</p>"}

function apply(){
  const d=document.documentElement;
  d.dataset.theme=S.theme;d.lang=S.lang;d.dir=S.lang==="ar"?"rtl":"ltr";d.style.setProperty("--fs",S.size+"px");
  document.title=T().t;
}
function head(){
  const t=T();
  $("#top").innerHTML='<div class="hd"><div><a class="logo" href="#/">'+esc(t.t)+'</a><div class="subt">'+esc(t.sub)+'</div></div><div class="ct">'+
  ["bn","ar"].map(l=>'<button class="pl" data-lang="'+l+'" aria-pressed="'+(S.lang===l)+'">'+(l==="bn"?"বাংলা":"العربية")+'</button>').join("")+
  '<select id="th" aria-label="'+t.theme+'">'+Object.keys(t.th).map(k=>'<option value="'+k+'"'+(S.theme===k?" selected":"")+'>'+t.th[k]+'</option>').join("")+'</select>'+
  '<button class="pl" id="fm" aria-label="A-">A−</button><button class="pl" id="fp" aria-label="A+">A+</button>'+
  '<a class="pl" href="#/my">★ '+t.mine+'</a><a class="pl" href="#/notice" aria-label="'+esc(t.noticeT)+'">🔔'+(maxN()>+ls("seen")?'<i class="dot"></i>':"")+"</a>"+
  '</div></div><div class="hd noprint" style="padding-top:0"><form id="sf" class="sf" role="search"><input type="search" name="q" value="'+esc(curQ())+'" placeholder="'+esc(t.srch)+'" aria-label="'+esc(t.srch)+'"><button class="pl" aria-label="search">🔍</button></form></div>';
}
function views(p){
  const t=T(),r=p[0]||"welcome";
  if(r==="welcome")return["اقرأ",'<section class="hero"><h1>'+t.hi+'</h1><p class="lead">'+t.msg+'</p><div class="who"><b>'+t.name+"</b><br>"+t.dept+"<br>"+t.uni+"<br>"+t.aff+'</div><a class="btn" href="#/level">'+t.next+"</a>"+(deferred?'<button class="btn alt" id="inst">'+t.install+"</button>":"")+'<p class="mu">'+t.ios+"</p></section>"];
  if(r==="level")return["الفقه",cr([[t.home,"#/"],[t.levelT]])+'<h2>'+t.levelT+'</h2><div class="grid">'+["honours","masters"].map(l=>'<a class="card" href="#/y/'+l+'"><b>'+t[l]+'</b><span class="chip">'+t.nc(num(Object.values(DATA[l]).reduce((a,c)=>a+c.length,0)))+"</span></a>").join("")+"</div>"];
  if(r==="s")return sview(curQ());
  if(r==="my")return myview();
  if(r==="notice")return nview();
  const l=p[1];if(!DATA[l])return views(["level"]);
  if(r==="y")return["الدرس",cr([[t.home,"#/level"],[lv(l)]])+"<h2>"+t.yearT+'</h2><div class="grid">'+Object.keys(DATA[l]).map(y=>'<a class="card" href="#/c/'+l+"/"+y+'"><b>'+yn(l,y)+'</b><span class="chip">'+t.nc(num(DATA[l][y].length))+"</span></a>").join("")+"</div>"];
  const y=p[2],cs=DATA[l][y];if(!cs)return views(["y",l]);
  if(r==="c")return["المقرر",cr([[t.home,"#/level"],[lv(l),"#/y/"+l],[yn(l,y)]])+"<h2>"+t.coursesT+'</h2><div class="grid">'+cs.map((c,i)=>'<a class="card" href="#/k/'+l+"/"+y+"/"+i+'"><b dir="auto">'+esc(c.n)+'</b><span class="mu" dir="auto" style="display:block">'+esc(c.a||"")+'</span><span class="chip">'+t.code+": "+esc(c.code||"—")+'</span><span class="chip">'+t.credit+": "+esc(c.cr||"—")+"</span></a>").join("")+"</div>"];
  const c=cs[+p[3]];if(!c)return views(["c",l,y]);
  if(tab==="bk"&&!c.bk.length)tab="sy";
  const sec=tab==="ds"?'<table class="tbl">'+c.dist.map(r=>'<tr><td dir="auto">'+esc(r[0])+'</td><td dir="auto">'+esc(r[1]||"")+"</td></tr>").join("")+"</table>"
   :tab==="bk"?c.bk.map(g=>'<h3 dir="auto">'+esc(g.h)+"</h3>"+g.items.map(b=>bookRow(b,c)).join("")).join("")
   :(c.syl.length?c.syl.map(x=>'<p class="sy'+(x.startsWith("• ")?" sub":"")+'" dir="auto">'+esc(x)+"</p>").join(""):'<p class="note">'+t.soon+"</p>");
  const tabs=[["sy",t.sy],["ds",t.ds]].concat(c.bk.length?[["bk",t.bkT]]:[]);
  const ch=(a,v)=>'<span class="chip">'+a+": "+esc(v||"—")+"</span>";
  return["الكتاب",cr([[t.home,"#/level"],[lv(l),"#/y/"+l],[yn(l,y),"#/c/"+l+"/"+y],[c.n]])+'<h2 dir="auto">'+esc(c.n)+'</h2><p class="mu" dir="auto">'+esc(c.a||"")+"</p>"+ch(t.code,c.code)+ch(t.mk,c.m)+ch(t.credit,c.cr)+ch(t.hr,c.h)+'<div class="tabs noprint">'+tabs.map(([k,v])=>'<button class="pl" data-tab="'+k+'" aria-pressed="'+(tab===k)+'">'+v+"</button>").join("")+'<button class="pl" data-print="1">'+t.print+"</button></div>"+sec];
}
function render(ns){
  const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean),r=p[0]||"welcome";
  const [w,h]=views(p);
  $("#bg").dataset.w=w;$("#app").innerHTML=h;
  if(r==="notice"){ls("seen",maxN());head()}
  foot();if(ns!==true)window.scrollTo(0,0);
}
function all(){apply();head();render()}
document.addEventListener("click",async e=>{
  const a=e.target.closest(".bk a.btn");
  if(a){const f=a.closest(".bk").querySelector("[data-fav]");if(f){const k=f.dataset.fav;ls("rec",JSON.stringify([k,...recs().filter(x=>x!==k)].slice(0,8)))}}
  const b=e.target.closest("[data-lang],[data-tab],[data-fav],[data-print],[data-share],[data-qr],[data-cform],[data-notif],#fm,#fp,#inst");if(!b)return;
  if(b.dataset.fav){const k=b.dataset.fav,f=favs(),on=!f.includes(k);ls("fav",JSON.stringify(on?[k,...f]:f.filter(x=>x!==k)));b.textContent=on?"★":"☆";b.setAttribute("aria-pressed",on);if(curR()==="my")render(true);return}
  if(b.dataset.print){window.print();return}
  if(b.dataset.share){const u=SITE.url||location.href.split("#")[0];if(navigator.share)navigator.share({title:T().t,url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>alert(T().copied));return}
  if(b.dataset.qr){const i=$("#qri"),w=$("#qrb");if(!i.getAttribute("src"))i.src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data="+encodeURIComponent(SITE.url);w.hidden=!w.hidden;return}
  if(b.dataset.cform){if(!(SITE.endpoint||SITE.key)&&SITE.form)window.open(SITE.form,"_blank","noopener");else{const w=$("#cfb");w.hidden=!w.hidden}return}
  if(b.dataset.notif){if(typeof Notification!=="undefined")Notification.requestPermission().then(p=>{if(p==="granted"){ls("notif","1");ls("notified",maxN());render(true)}});return}
  if(b.dataset.lang){S.lang=b.dataset.lang;ls("lang",S.lang);return all()}
  if(b.dataset.tab){tab=b.dataset.tab;return render()}
  if(b.id==="fm"||b.id==="fp"){S.size=Math.min(24,Math.max(14,S.size+(b.id==="fp"?1:-1)));ls("size",S.size);return apply()}
  if(b.id==="inst"&&deferred){deferred.prompt();deferred=null;return render()}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="sf"){e.preventDefault();const q=e.target.q.value.trim();if(q)location.hash="#/s/"+encodeURIComponent(q)}
  if(e.target.id==="cf"){e.preventDefault();const f=e.target,t=T();if(f._gotcha.value)return;const fd=new FormData(f);fd.append("subject",f.topic.value+" — "+t.t);fd.append("page",location.href);if(SITE.key)fd.append("access_key",SITE.key);const bt=f.querySelector("button");bt.disabled=true;
    fetch(SITE.endpoint||"https://api.web3forms.com/submit",{method:"POST",body:fd,headers:{Accept:"application/json"}}).then(r=>{if(!r.ok)throw 0;f.reset();$("#cmsg").textContent=t.cOk}).catch(()=>{$("#cmsg").textContent=t.cErr}).finally(()=>{bt.disabled=false})}
});
document.addEventListener("change",e=>{if(e.target.id==="th"){S.theme=e.target.value;ls("theme",S.theme);apply()}});
window.addEventListener("hashchange",render);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;render()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(ls("notif")==="1"&&typeof Notification!=="undefined"&&Notification.permission==="granted"&&maxN()>+(ls("notified")||0)&&"serviceWorker" in navigator){const n=NOTICES.slice().sort((a,b)=>b.id-a.id)[0],x=n[S.lang]||n.bn;navigator.serviceWorker.ready.then(r=>r.showNotification(x.t,{body:x.b,icon:"icon-192.png",tag:"notice"+n.id})).catch(()=>{});ls("notified",n.id)}
all();
</script>
</body>
</html>
