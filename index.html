<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiqh Library · ফিকহ গ্রন্থাগার · مكتبة الفقه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@600;800&family=Noto+Naskh+Arabic:wght@400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--surface:#fff;--ink:#17231f;--muted:#5b6b65;--line:#d3dcd7;--pine:#0f3d3a;--brass:#a97c1f;--on-pine:#f3f6f4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1513;--surface:#16211e;--ink:#e8efec;--muted:#9fb1aa;--line:#2a3a35;--pine:#7fc4b8;--brass:#d9a940;--on-pine:#0e1513;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1513;--surface:#16211e;--ink:#e8efec;--muted:#9fb1aa;--line:#2a3a35;--pine:#7fc4b8;--brass:#d9a940;--on-pine:#0e1513;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;font-size:17px;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang="ar"] body{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:19px;line-height:1.9}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
header{padding:28px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:15px;color:var(--muted);margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:2px 14px;font:inherit;font-size:14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--pine);color:var(--on-pine);border-color:var(--pine)}
h1{font-family:"Noto Serif Bengali",serif;font-weight:800;font-size:clamp(32px,7vw,54px);line-height:1.3;margin:18px 0 8px;color:var(--pine)}
html[lang="ar"] h1{font-family:"Amiri",serif;font-weight:700}
html[lang="en"] h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.15}
.lead{margin:0 0 24px;color:var(--muted);max-width:56ch}
.search{display:flex;border:2px solid var(--pine);border-radius:12px;background:var(--surface);overflow:hidden}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:19px;padding:14px 16px;min-width:0}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 45%,transparent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.count{color:var(--muted);font-size:15px;margin:14px 0}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.book{display:grid;grid-template-columns:10px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.spine{background:var(--c)}
.body{padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:center}
.info{flex:1 1 320px;min-width:0}
.book h2{font-size:20px;margin:0;line-height:1.5;font-weight:600}
.orig{font-family:"Amiri",serif;font-size:21px;color:var(--brass);display:block;line-height:1.5}
.meta{font-size:15px;color:var(--muted);margin:2px 0 0}
.acts{display:flex;gap:8px}
.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:6px 16px;font-size:15px;font-weight:500;border:1px solid var(--pine);color:var(--pine)}
.btn.main{background:var(--pine);color:var(--on-pine)}
.pill:focus-visible,.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.soon{font-size:15px;color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{margin:48px 0 32px;padding-top:20px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
footer a{color:var(--pine)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <p class="brand" id="brand"></p>
    <div class="tools">
      <span id="langs" role="group" aria-label="Language" style="display:flex;gap:8px"></span>
      <button class="pill" id="theme" type="button"></button>
    </div>
  </div>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <label class="search">
    <span id="qlabel" style="position:absolute;left:-9999px"></span>
    <input id="q" type="search" autocomplete="off">
  </label>
  <div class="filters" id="years" role="group"></div>
  <div class="filters" id="subjects" role="group"></div>
</header>
<main>
  <p class="count" id="count" aria-live="polite"></p>
  <ul class="list" id="list"></ul>
</main>
<footer><span id="foot"></span> <a href="mailto:your-email@example.com">your-email@example.com</a></footer>
</div>
<script>
/* ===== ইন্টারফেসের লেখা (তিন ভাষা) ===== */
const UI = {
  bn:{name:"বাংলা",dir:"ltr",locale:"bn-BD",brand:"ইসলামী আরবি বিশ্ববিদ্যালয় · আল-ফিকহ অ্যান্ড ইসলামিক স্টাডিজ",h1:"বিভাগের সব বই, এক জায়গায়",lead:"নাম, লেখক বা বিষয় লিখে খুঁজুন। অনলাইনে পড়ুন অথবা ডাউনলোড করে নিন। কোনো নিবন্ধন লাগবে না।",ph:"যেমন: হিদায়া, আহাদীসুল আহকাম…",all:"সব",years:"বর্ষ",subjects:"বিষয়",found:n=>n+"টি বই পাওয়া গেছে",none:"কোনো বই মেলেনি। অন্য শব্দ দিয়ে খুঁজুন।",read:"অনলাইনে পড়ুন",dl:"ডাউনলোড",soon:"শীঘ্রই আসছে",dark:"অন্ধকার মোড",light:"আলো মোড",foot:"বই যোগ করতে বা কোনো বই সরানোর অনুরোধ জানাতে যোগাযোগ করুন:"},
  ar:{name:"العربية",dir:"rtl",locale:"ar",brand:"الجامعة الإسلامية العربية · قسم الفقه والدراسات الإسلامية",h1:"كتب القسم كلها في مكان واحد",lead:"ابحث بالعنوان أو المؤلف أو المادة، ثم اقرأ الكتاب على الإنترنت أو حمّله. لا حاجة إلى التسجيل.",ph:"مثال: الهداية، أحاديث الأحكام…",all:"الكل",years:"السنة",subjects:"المادة",found:n=>"تم العثور على "+n+" كتاب",none:"لم يُعثر على أي كتاب. جرّب كلمة أخرى.",read:"اقرأ على الإنترنت",dl:"تحميل",soon:"قريبًا",dark:"الوضع الداكن",light:"الوضع الفاتح",foot:"لإضافة كتاب أو طلب حذف كتاب، تواصل معنا:"},
  en:{name:"English",dir:"ltr",locale:"en",brand:"Islamic Arabic University · Al-Fiqh & Islamic Studies",h1:"Every book of the department, in one place",lead:"Search by title, author or subject. Read online or download. No sign-up needed.",ph:"For example: Hidaya, Ahadith al-Ahkam…",all:"All",years:"Year",subjects:"Subject",found:n=>n+(n===1?" book found":" books found"),none:"No books found. Try a different word.",read:"Read online",dl:"Download",soon:"Coming soon",dark:"Dark mode",light:"Light mode",foot:"To add a book or request a removal, contact:"}
};
const YEARS = {y1:{bn:"১ম বর্ষ",ar:"السنة الأولى",en:"1st Year"}};
const SUBJ = {
  fiqh:{bn:"ফিকহ",ar:"الفقه",en:"Fiqh"},
  usul:{bn:"উসূলুল ফিকহ",ar:"أصول الفقه",en:"Usul al-Fiqh"},
  hadith:{bn:"হাদীস",ar:"الحديث",en:"Hadith"},
  tafsir:{bn:"তাফসীর",ar:"التفسير",en:"Tafsir"},
  aqida:{bn:"আকীদা",ar:"العقيدة",en:"Aqidah"},
  arabic:{bn:"আরবি",ar:"اللغة العربية",en:"Arabic"}
};
/* ===== বই যোগ করার জায়গা =====
   একটি লাইন কপি করে তিন ভাষার নাম, লেখক ও লিংক বসান।
   read / download খালি রাখলে "শীঘ্রই আসছে" দেখাবে। */
const BOOKS = [
  {t:{bn:"হিদায়া",ar:"الهداية",en:"Al-Hidaya"},a:{bn:"বুরহানুদ্দীন আল-মারগীনানী",ar:"برهان الدين المرغيناني",en:"Burhan al-Din al-Marghinani"},year:"y1",subj:"fiqh",read:"",download:""},
  {t:{bn:"নূরুল আনওয়ার",ar:"نور الأنوار",en:"Nur al-Anwar"},a:{bn:"মুল্লা জিওয়ান",ar:"الملا جيون",en:"Mulla Jiwan"},year:"y1",subj:"usul",read:"",download:""},
  {t:{bn:"আহাদীসুল আহকাম",ar:"أحاديث الأحكام",en:"Ahadith al-Ahkam"},a:{bn:"",ar:"",en:""},year:"y1",subj:"hadith",read:"",download:""},
  {t:{bn:"আয়াতুল আহকাম",ar:"آيات الأحكام",en:"Ayat al-Ahkam"},a:{bn:"",ar:"",en:""},year:"y1",subj:"tafsir",read:"",download:""},
  {t:{bn:"আল-আকীদাতুল ইসলামিয়্যাহ",ar:"العقيدة الإسلامية",en:"Al-Aqidah al-Islamiyyah"},a:{bn:"",ar:"",en:""},year:"y1",subj:"aqida",read:"",download:""},
  {t:{bn:"আরবি (২য় পত্র)",ar:"اللغة العربية (الورقة الثانية)",en:"Arabic (2nd Paper)"},a:{bn:"",ar:"",en:""},year:"y1",subj:"arabic",read:"",download:""}
];
const COLORS = ["#0f6b5c","#a97c1f","#2f5d8a","#8a3f4f","#5a6b2a","#6b4e8a"];
const keys = Object.keys(SUBJ);
const $ = id => document.getElementById(id);
const state = {q:"", year:"all", subj:"all", lang:"bn"};
try{ const s = localStorage.getItem("lang"); if(s && UI[s]) state.lang = s; else { const n = (navigator.language||"").slice(0,2); if(UI[n]) state.lang = n; } }catch(e){}

function pills(el, list, key, label){
  el.innerHTML = ""; el.setAttribute("aria-label", label);
  list.forEach(([v,text]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pill"; b.textContent = text;
    b.setAttribute("aria-pressed", state[key] === v);
    b.onclick = () => { state[key] = v; draw(); };
    el.appendChild(b);
  });
}
function draw(){
  const L = state.lang, T = UI[L];
  document.documentElement.lang = L; document.documentElement.dir = T.dir;
  document.title = {bn:"ফিকহ গ্রন্থাগার",ar:"مكتبة الفقه",en:"Fiqh Library"}[L];
  $("brand").textContent = T.brand; $("h1").textContent = T.h1; $("lead").textContent = T.lead;
  $("q").placeholder = T.ph; $("qlabel").textContent = T.ph; $("foot").textContent = T.foot;
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  $("theme").textContent = dark ? T.light : T.dark;
  const lg = $("langs"); lg.innerHTML = "";
  Object.keys(UI).forEach(k => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pill"; b.textContent = UI[k].name; b.lang = k;
    b.setAttribute("aria-pressed", k === L);
    b.onclick = () => { state.lang = k; try{ localStorage.setItem("lang", k); }catch(e){} draw(); };
    lg.appendChild(b);
  });
  pills($("years"), [["all",T.all], ...Object.keys(YEARS).map(k => [k, YEARS[k][L]])], "year", T.years);
  pills($("subjects"), [["all",T.all], ...keys.map(k => [k, SUBJ[k][L]])], "subj", T.subjects);
  const q = $("q").value.trim().toLowerCase();
  const rows = BOOKS.filter(b =>
    (state.year === "all" || b.year === state.year) &&
    (state.subj === "all" || b.subj === state.subj) &&
    (!q || [b.t.bn,b.t.ar,b.t.en,b.a.bn,b.a.ar,b.a.en,SUBJ[b.subj][L]].join(" ").toLowerCase().includes(q)));
  $("count").textContent = T.found(new Intl.NumberFormat(T.locale).format(rows.length));
  const list = $("list"); list.innerHTML = "";
  if(!rows.length){ const li = document.createElement("li"); li.className = "empty"; li.textContent = T.none; list.appendChild(li); return; }
  rows.forEach(b => {
    const li = document.createElement("li"); li.className = "book";
    li.style.setProperty("--c", COLORS[keys.indexOf(b.subj) % COLORS.length]);
    li.innerHTML = '<div class="spine"></div><div class="body"><div class="info"><h2></h2><span class="orig" dir="rtl" lang="ar"></span><p class="meta"></p></div><div class="acts"></div></div>';
    li.querySelector("h2").textContent = b.t[L];
    const o = li.querySelector(".orig"); if(L === "ar") o.remove(); else o.textContent = b.t.ar;
    li.querySelector(".meta").textContent = [YEARS[b.year][L], SUBJ[b.subj][L], b.a[L]].filter(Boolean).join(" • ");
    const acts = li.querySelector(".acts");
    const add = (href, text, cls) => { const a = document.createElement("a"); a.className = "btn " + cls; a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = text; acts.appendChild(a); };
    if(!b.read && !b.download){ const s = document.createElement("span"); s.className = "soon"; s.textContent = T.soon; acts.appendChild(s); }
    if(b.read) add(b.read, T.read, "main");
    if(b.download) add(b.download, T.dl, "");
    list.appendChild(li);
  });
}
$("q").addEventListener("input", draw);
$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.theme = dark ? "light" : "dark"; draw();
};
draw();
</script>
</body>
</html>
